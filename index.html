<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeBase TV Remote</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 { margin-top: 10px; }

    #status {
      color: #bbb;
      min-height: 24px;
    }

    button {
      font-size: 22px;
      padding: 16px;
      margin: 6px;
      border: 0;
      border-radius: 14px;
      min-width: 82px;
      background: #333;
      color: white;
    }

    button:active {
      background: #555;
      transform: scale(0.97);
    }

    .wide { min-width: 190px; }

    .grid {
      display: grid;
      grid-template-columns: 90px 90px 90px;
      justify-content: center;
      gap: 8px;
      margin: 20px 0;
    }

    .spacer { visibility: hidden; }

    .small {
      font-size: 14px;
      color: #777;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <h1>📺 HomeBase TV</h1>
  <p id="status">Ready</p>

  <button class="wide" onclick="rokuForm('Power')">Power</button>

  <div class="grid">
    <button class="spacer">.</button>
    <button onclick="rokuForm('Up')">▲</button>
    <button class="spacer">.</button>

    <button onclick="rokuForm('Left')">◀</button>
    <button onclick="rokuForm('Select')">OK</button>
    <button onclick="rokuForm('Right')">▶</button>

    <button class="spacer">.</button>
    <button onclick="rokuForm('Down')">▼</button>
    <button class="spacer">.</button>
  </div>

  <button onclick="rokuForm('Back')">Back</button>
  <button onclick="rokuForm('Home')">Home</button>

  <br>

  <button onclick="rokuForm('Rev')">⏪</button>
  <button onclick="rokuForm('Play')">⏯</button>
  <button onclick="rokuForm('Fwd')">⏩</button>

  <br>

  <button onclick="rokuForm('VolumeDown')">Vol -</button>
  <button onclick="rokuForm('VolumeMute')">Mute</button>
  <button onclick="rokuForm('VolumeUp')">Vol +</button>

  <p class="small">Target: 192.168.1.3</p>

  <iframe name="rokuTarget" style="display:none;"></iframe>

  <script>
    const rokuIpAddress = "192.168.1.3";

    function rokuForm(command) {
      document.getElementById("status").textContent = "Sending " + command + "...";

      const form = document.createElement("form");
      form.method = "POST";
      form.action = "http://" + rokuIpAddress + ":8060/keypress/" + command;
      form.target = "rokuTarget";

      document.body.appendChild(form);
      form.submit();
      document.body.removeChild(form);

      setTimeout(function () {
        document.getElementById("status").textContent = "Sent: " + command;
      }, 300);
    }

    const params = new URLSearchParams(window.location.search);

    if (params.get("power") === "toggle") {
      rokuForm("Power");
    }
  </script>
</body>
</html>
