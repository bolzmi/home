<style>
:root {
  --bg:#e9edf2;
  --card:#ffffff;
  --text:#18212b;
  --muted:#667085;
  --blue:#1f5f99;
  --line:#c5ced8;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  overflow:hidden;
}
.shell {
  height:100%;
  display:flex;
  flex-direction:column;
}
.topbar {
  flex:0 0 auto;
  background:var(--card);
  border-bottom:1px solid var(--line);
  padding:10px 12px 9px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  z-index:10;
}
.title {
  text-align:center;
  font-weight:800;
  font-size:.94rem;
  margin-bottom:8px;
}
.tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:min(100%,540px);
  margin:auto;
}
.tab {
  border:1px solid var(--blue);
  background:white;
  color:var(--blue);
  border-radius:11px;
  padding:10px 8px;
  font-weight:800;
  font-size:.91rem;
  cursor:pointer;
}
.tab.active {
  background:var(--blue);
  color:white;
}
.frame-wrap {
  flex:1 1 auto;
  min-height:0;
  position:relative;
}
iframe {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#f3f5f7;
  display:none;
}
iframe.active { display:block; }
.hint {
  text-align:center;
  color:var(--muted);
  font-size:.72rem;
  margin-top:6px;
}
</style>
</head>

function loadFrame(team) {
  const frame = document.getElementById("frame-" + team);
  if (!frame.dataset.loaded) {
    frame.src = "data:text/html;base64," + documents[team];
    frame.dataset.loaded = "true";
  }
}

function showTeam(team) {
  document.querySelectorAll(".tab").forEach(btn =>
    btn.classList.toggle("active", btn.dataset.team === team)
  );
  document.querySelectorAll("iframe").forEach(frame =>
    frame.classList.toggle("active", frame.id === "frame-" + team)
  );
  loadFrame(team);
  try { localStorage.setItem("legacy-team", team); } catch (e) {}
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => showTeam(btn.dataset.team));
});

let initial = "15u";
try {
  const saved = localStorage.getItem("legacy-team");
  if (saved === "15u" || saved === "6th") initial = saved;
} catch (e) {}
showTeam(initial);
</script>
